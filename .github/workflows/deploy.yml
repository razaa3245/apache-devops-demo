name: Apache DevOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Test website
        shell: powershell
        run: |
          $html = Get-Content index.html -Raw

          if ($html -notmatch '(?s)<h1\b[^>]*>.+?</h1>') {
            throw "Required heading missing! Deployment stopped."
          }

          Write-Host "Website test passed!"

      - name: Deploy to Apache
        shell: powershell
        run: |
          Copy-Item index.html C:\Apache24\htdocs\index.html -Force
          Write-Host "Website deployed successfully!"

      - name: Verify Apache website
        shell: powershell
        run: |
          $response = Invoke-WebRequest http://localhost -UseBasicParsing

          if ($response.StatusCode -ne 200) {
            throw "Apache verification failed!"
          }

          Write-Host "Apache HTTP verification successful!"